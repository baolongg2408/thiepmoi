<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <!-- Đổ bóng cho các khối và ghim -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#552233" flood-opacity="0.18"/>
    </filter>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#8d3f5a" flood-opacity="0.35"/>
    </filter>
    <!-- Gradient cho ghim định vị -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0587f"/>
      <stop offset="100%" stop-color="#9e2d4e"/>
    </linearGradient>
    <!-- Gradient cho tòa nhà Nhà hát -->
    <linearGradient id="theaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f4"/>
      <stop offset="100%" stop-color="#fde2e8"/>
    </linearGradient>
  </defs>

  <!-- Nền bản đồ phong cách đô thị hiện đại -->
  <rect width="600" height="320" fill="#f5f3ee"/>

  <!-- Các khu đất đô thị xung quanh -->
  <rect x="20" y="20" width="160" height="80" rx="4" fill="#ebe7de"/>
  <rect x="20" y="120" width="130" height="180" rx="4" fill="#ebe7de"/>
  <rect x="440" y="20" width="140" height="90" rx="4" fill="#ebe7de"/>
  <rect x="460" y="180" width="120" height="120" rx="4" fill="#ebe7de"/>

  <!-- Mảng xanh Công viên Kỳ Hòa (ngay phía sau Nhà hát Hòa Bình) -->
  <path d="M 210,20 L 410,20 L 410,95 L 210,95 Z" fill="#d7ecd3" rx="6"/>
  <text x="310" y="58" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#5f8c5b" text-anchor="middle" letter-spacing="0.5">🌳 CÔNG VIÊN KỲ HÒA</text>

  <!-- Tuyến đường: Đường Cao Thắng (nối từ 3 Tháng 2 lên) -->
  <rect x="175" y="0" width="30" height="320" fill="#ffffff" stroke="#e0ded6" stroke-width="1.5"/>
  <text x="190" y="260" font-family="'DM Sans', sans-serif" font-size="9" font-weight="500" fill="#999285" text-anchor="middle" transform="rotate(-90 190 260)" letter-spacing="1">ĐƯỜNG CAO THẮNG</text>

  <!-- Tuyến đường: Đường Lê Hồng Phong -->
  <rect x="415" y="0" width="32" height="320" fill="#ffffff" stroke="#e0ded6" stroke-width="1.5"/>
  <text x="431" y="270" font-family="'DM Sans', sans-serif" font-size="9" font-weight="500" fill="#999285" text-anchor="middle" transform="rotate(-90 431 270)" letter-spacing="1">ĐƯỜNG LÊ HỒNG PHONG</text>

  <!-- Tuyến đường chính: ĐƯỜNG 3 THÁNG 2 (Rộng, nổi bật) -->
  <rect x="0" y="110" width="600" height="54" fill="#fff9e6" stroke="#ebd99f" stroke-width="2"/>
  <!-- Vạch phân làn đường -->
  <line x1="0" y1="137" x2="600" y2="137" stroke="#ebd99f" stroke-width="1.5" stroke-dasharray="16,12"/>
  <!-- Tên đường 3 Tháng 2 -->
  <text x="90" y="141" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#8f7a42" letter-spacing="1.5">ĐƯỜNG 3 THÁNG 2</text>
  <text x="500" y="141" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#8f7a42" letter-spacing="1.5">ĐƯỜNG 3 THÁNG 2</text>

  <!-- Khối khuôn viên Nhà hát Hòa Bình (Số 240) -->
  <g filter="url(#shadow)">
    <!-- Đất khuôn viên -->
    <rect x="220" y="80" width="180" height="120" rx="8" fill="url(#theaterGrad)" stroke="#e8b5c4" stroke-width="2"/>
    
    <!-- Tòa nhà chính Nhà hát Hòa Bình -->
    <rect x="235" y="92" width="150" height="65" rx="5" fill="#ffffff" stroke="#df9cb0" stroke-width="1.5"/>
    
    <!-- Mái sảnh vòm trang trí -->
    <path d="M 270,92 Q 310,80 350,92 Z" fill="#b85273" opacity="0.85"/>
    <text x="310" y="112" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#8d3f5a" text-anchor="middle">🎭 NHÀ HÁT HÒA BÌNH</text>
    <text x="310" y="128" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="600" fill="#b0627b" text-anchor="middle">Số 240 Đường 3 Tháng 2, Q.10</text>
  </g>

  <!-- Vòng sóng radar nhấp nháy tại ghim định vị -->
  <circle cx="310" cy="180" r="18" fill="none" stroke="#d64d75" stroke-width="2" opacity="0.4"/>
  <circle cx="310" cy="180" r="8" fill="#d64d75" opacity="0.25"/>

  <!-- Ghim bản đồ (Map Pin) sang trọng -->
  <g filter="url(#pinShadow)">
    <path d="M 310,182 C 298,182 292,168 292,158 C 292,148 300,140 310,140 C 320,140 328,148 328,158 C 328,168 322,182 310,182 Z" fill="url(#pinGrad)"/>
    <circle cx="310" cy="157" r="5.5" fill="#ffffff"/>
  </g>

  <!-- Nhãn chỉ dẫn nhanh ở góc bản đồ -->
  <g filter="url(#shadow)">
    <rect x="18" y="270" width="220" height="34" rx="17" fill="#ffffff" stroke="#ead4db" stroke-width="1"/>
    <circle cx="36" cy="287" r="9" fill="#fde6ec"/>
    <text x="36" y="291" font-family="sans-serif" font-size="11" fill="#c44d70" text-anchor="middle">📍</text>
    <text x="54" y="291" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#753e50">Nhà hát Hòa Bình · Q.10</text>
  </g>

  <!-- Nút tương tác góc dưới bên phải -->
  <g filter="url(#shadow)">
    <rect x="420" y="270" width="162" height="34" rx="17" fill="#8d3f5a"/>
    <text x="501" y="291" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Chạm để mở Maps ↗</text>
  </g>
</svg>
